name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in ShareDash
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please verify the following before submitting:
      options:
        - label: I have searched existing GitHub issues to make sure this is not a duplicate.
          required: true
        - label: I am running the latest release or latest commit on `main`.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of ShareDash is experiencing the issue?
      options:
        - Windows Desktop App / CLI Wizard
        - Android Companion App
        - Multipath Aggregation Engine
        - Bluetooth LE Discovery & Pairing
        - Hotspot / Wi-Fi Direct Orchestration
        - USB 3.x / ADB Fast-Path
        - File Integrity / Sparse Disk Writer
      default: 0
    validations:
      required: true

  - type: dropdown
    id: os_version
    attributes:
      label: Operating System (Host PC)
      options:
        - Windows 11 (23H2 / 24H2)
        - Windows 10 (21H2 / 22H2)
        - Linux (Ubuntu / Debian / Arch / Fedora)
        - macOS
      default: 0
    validations:
      required: true

  - type: input
    id: android_device
    attributes:
      label: Android Device & Android OS Version
      description: e.g. Samsung Galaxy S23 (Android 14 / OneUI 6.1) or Pixel 8 Pro (Android 14)
      placeholder: e.g., Google Pixel 7, Android 14

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what happened and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior step by step?
      placeholder: |
        1. Launch `cargo run --release` on PC
        2. Connect phone via USB-C cable
        3. Select Option [1] Auto-Connect Wizard
        4. Transfer file > 1GB
        5. Observe error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output
      description: Paste any relevant terminal logs, stack traces, or console outputs (run with `RUST_LOG=debug`).
      render: shell

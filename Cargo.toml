[package]
name = "sharedash"
version = "0.1.0"
edition = "2021"
default-run = "sharedash"
description = "High-Performance Multipath Offline P2P File Transfer Engine for Windows & Android"
authors = ["SamSunny4 <https://github.com/SamSunny4>", "ShareDash Contributors"]
license = "MIT"
repository = "https://github.com/SamSunny4/ShareDash"
homepage = "https://github.com/SamSunny4/ShareDash"
readme = "README.md"
keywords = ["file-transfer", "multipath", "p2p", "offline", "high-performance"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "3.0"
sha2 = "0.10"
blake3 = "1.5"
crc32fast = "1.4"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
rand = "0.8"
hex = "0.4"
qrcode = "0.14"
local-ip-address = "0.6"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
btleplug = "0.11"
memmap2 = "0.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.12"
tokio-test = "0.4"
